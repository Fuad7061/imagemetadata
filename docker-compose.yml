services:
  imagemetadata:
    build: .
    image: imagemetadata:latest
    container_name: imagemetadata
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DATA_DIR: /app/data
      LOG_RETENTION_DAYS: "10"
      MAX_BODY_SIZE_MB: "15"
      # Set this in Coolify (or uncomment locally). If omitted, a random key is
      # generated on first boot and written to /app/data/ADMIN_KEY.txt.
      # ADMIN_KEY: "change-this-to-a-long-random-secret"
      # PUBLIC_BASE_URL: "https://images.example.com"
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
